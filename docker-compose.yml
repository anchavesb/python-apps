services:
  # --- AI Services (CPU-only in Docker on Mac, Native recommended for MPS/MLX) ---
  
  dolores-brain:
    build:
      context: .
      dockerfile: apps/dolores-brain/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dolores-brain-data:/app/data

  dolores-stt:
    build:
      context: .
      dockerfile: apps/dolores-stt/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - STT_CPU_THREADS=8
      - LOG_LEVEL=INFO
    volumes:
      - dolores-stt-data:/app/data
      - dolores-stt-models:/app/models

  dolores-tts:
    build:
      context: .
      dockerfile: apps/dolores-tts/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=INFO
      - TTS_ENGINE=coqui_xtts # Use coqui_xtts or piper (f5_tts requires native MLX)
    volumes:
      - dolores-tts-data:/app/data
      - dolores-tts-models:/app/models

  # --- Orchestrator & Logic ---

  dolores-assistant:
    build:
      context: .
      dockerfile: apps/dolores-assistant/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DOLORES_STT_URL=http://dolores-stt:8001
      - DOLORES_TTS_URL=http://dolores-tts:8002
      - DOLORES_BRAIN_URL=http://dolores-brain:8003
      - DOLORES_INTEGRATIONS=[{"name":"todo","url":"http://todo:5000","spec_path":"/v1/openapi.json"}]
      - LOG_LEVEL=INFO
    depends_on:
      - dolores-stt
      - dolores-tts
      - dolores-brain

  # --- External Apps / Tools ---

  todo:
    build:
      context: apps/todo
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@todo-db:5432/postgres
    depends_on:
      - todo-db

  todo-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - todo-db-data:/var/lib/postgresql/data

  # --- Frontend ---

  dolores-web:
    build:
      context: apps/dolores-web
    ports:
      - "8080:8080"
    environment:
      - VITE_DOLORES_URL=http://localhost:8000
    depends_on:
      - dolores-assistant

volumes:
  dolores-brain-data:
  dolores-stt-data:
  dolores-stt-models:
  dolores-tts-data:
  dolores-tts-models:
  todo-db-data:
