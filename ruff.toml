line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501", # line too long — enforced by formatter, not linter
]

[lint.isort]
known-first-party = [
    "dolores_common",
    "dolores_assistant",
    "dolores_brain",
    "dolores_cli",
    "dolores_stt",
    "dolores_tts",
]

[format]
line-ending = "lf"
