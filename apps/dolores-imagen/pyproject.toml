[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dolores-imagen"
version = "0.1.1"
description = "Dolores Image Generation service (FLUX / Stable Diffusion)"
authors = [{ name = "Achaves" }]
requires-python = ">=3.10"
dependencies = [
    "dolores-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "httpx>=0.25",
]
gpu = [
    "diffusers>=0.31.0",
    "torch>=2.1.0",
    "accelerate>=0.26.0",
    "transformers>=4.43.0",
    "Pillow>=10.0.0",
    "sentencepiece>=0.2.1",
    "protobuf>=5.29.0",
]

[project.scripts]
"dolores-imagen" = "dolores_imagen.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dolores_imagen*"]
