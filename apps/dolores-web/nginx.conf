server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    
    types {
        application/wasm wasm;
        application/octet-stream onnx;
        application/javascript js mjs;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Handle the /app/ subpath (SPA)
    location /app/ {
        index index.html;
        try_files $uri $uri/ /app/index.html;
        
        # Required for SharedArrayBuffer and WASM workers
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
    }

    # Handle VAD assets at the root /vad/ path
    location /vad/ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        # Workers need these headers too to be allowed in a COEP context
        add_header Cross-Origin-Resource-Policy cross-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # API and Health checks
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}
