server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Include standard types
    include /etc/nginx/mime.types;
    
    # Force specific MIME types for VAD/ONNX
    # We define these outside a block to ensure they apply globally
    types {
        application/wasm wasm;
        application/octet-stream onnx;
        text/javascript js mjs;
    }

    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 256;

    # Handle VAD assets at the root /vad/ path
    # Using 'root' instead of 'alias' for better try_files compatibility
    location /vad/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy cross-origin;
        # Cache these large assets
        expires 30d;
    }

    # Handle the /app/ subpath (SPA)
    location /app/ {
        # This matches /usr/share/nginx/html/app/
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
        
        # Required for SharedArrayBuffer
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
    }

    # API and Health checks
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}
