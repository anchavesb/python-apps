server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    
    # Global MIME overrides
    types {
        application/wasm wasm;
        application/octet-stream onnx;
        application/javascript js mjs;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 256;

    # 1. PREVENT SPA FALLBACK FOR ASSETS (THE CRITICAL FIX)
    # This block matches any WASM, ONNX, or MJS file anywhere
    # and ensures it returns 404 if missing, NOT index.html.
    location ~* \.(onnx|wasm|mjs)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy same-origin;
        try_files $uri =404;
    }

    # 2. Handle the /app/ subpath (SPA)
    location /app/ {
        # Maps /app/ to /usr/share/nginx/html/app/
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
        
        # Security headers for ONNX Runtime / SharedArrayBuffer
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
    }

    # 3. API & Health
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # 4. Redirect root to /app/
    location / {
        return 301 /app/;
    }
}
