server {
    listen 8080;
    server_name _;
    
    # Standard root for the whole server
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    
    types {
        application/wasm wasm;
        application/octet-stream onnx;
        text/javascript js mjs;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 256;

    # 1. Explicitly serve VAD assets from the subpath
    # We disable the SPA fallback (index.html) for this specific folder
    location /app/vad/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy same-origin;
        expires 30d;
    }

    # 2. Handle the main SPA subpath
    location /app/ {
        # With root set at the top, /app/ maps to /usr/share/nginx/html/app/
        try_files $uri $uri/ /app/index.html;
        
        # Required for SharedArrayBuffer
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
    }

    # API and Health checks
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}
