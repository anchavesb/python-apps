server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    
    # Add/override specific types for VAD
    types {
        application/wasm wasm;
        application/octet-stream onnx;
        application/javascript js mjs;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 256;

    # 1. Handle VAD assets at the ROOT /vad/ path
    # This must come BEFORE the SPA location to ensure it's not caught by SPA fallback.
    location /vad/ {
        alias /usr/share/nginx/html/vad/;
        # Disable SPA fallback here
        try_files $uri =404;
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy cross-origin;
    }

    # 2. Handle the /app/ subpath (SPA)
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        
        # Required for SharedArrayBuffer
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
    }

    # API and Health checks
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}
