server {
    listen 8080;
    server_name _;
    
    # Simple, standard root. 
    # Files are in /usr/share/nginx/html/app/ (from Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    
    # Forced MIME types for Safari module/WASM support
    types {
        application/wasm wasm;
        application/octet-stream onnx;
        application/javascript js mjs;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 256;

    # 1. VAD Assets Block - NO FALLBACK
    # If a file is missing here, Nginx WILL return 404, not index.html.
    location /app/vad/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy same-origin;
        expires 30d;
    }

    # 2. Main SPA Block
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        
        # Security headers for ONNX Runtime / SharedArrayBuffer
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
    }

    # 3. API & Health
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # 4. Redirect root to /app/
    location / {
        return 301 /app/;
    }
}
